name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate sample trajectory
        run: python3 scripts/validate_trajectory.py benchmark/sample-trajectory.json --strict
      - name: Check skill entrypoints
        run: |
          test -f skills/co-explore/SKILL.md
          test -f skills/co-explore-zh/SKILL.md
          grep -q '^description:' skills/co-explore/SKILL.md
          grep -q '^description:' skills/co-explore-zh/SKILL.md
