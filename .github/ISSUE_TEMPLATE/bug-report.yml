name: Bug report
about: Report a problem in a skill, template, script or schema
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [English skill, Chinese skill, templates, benchmark, scripts, documentation]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
  - type: input
    id: environment
    attributes:
      label: Agent or environment version
